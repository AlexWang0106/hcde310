<!doctype html>
<html lang="en">
<head><title>Artwork Search</title></head>
<body>
  <h1>Artwork Search</h1>

  <form action="/results" method="get">
    <label for="author">Search artworks</label>
    <input type="text" id="author" name="author_search">
    <button type="submit">Find artworks</button>
  </form>
  {% if message %}
    <p>{{ message }}</p>
  {% endif %}
</body>
</html>
